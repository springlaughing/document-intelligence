services:
  # --- Azure Service Bus Emulator ---
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    env_file:
      - ./docker/env/sqledge.env
    ports:
      - "1433:1433"   # optional, but good for debugging
    healthcheck:
      # Full path: the image ships sqlcmd in /opt/mssql-tools/bin but does not put it on
      # PATH, so a bare "sqlcmd" always exits 127. That made this check unpassable, and
      # with servicebus waiting on service_healthy it meant the stack never came up.
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # SQL Edge needs a while before it accepts connections; without this the retries
      # are spent on a server that simply has not finished starting.
      start_period: 30s
    networks:
      - backend

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    env_file:
      - ./docker/env/servicebus.env
    volumes:
      - ./infrastructure/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"  # AMQP (what Azure.Messaging.ServiceBus uses)
      - "5300:5300"  # Optional management/diagnostics port
    depends_on:
      sqledge:
        condition: service_healthy
    networks:
      - backend

  # --- Entry point in front of the API replicas ---
  #
  # Compose alone cannot balance across replicas. Its embedded DNS returns every replica's
  # address for the service name, but that only spreads connections: it hands out addresses
  # of replicas that are dead or not yet ready, because nothing consults /health/ready, and
  # a client that caches DNS pins itself to one of them.
  #
  # Traefik discovers the replicas from the Docker socket as they come and go, and actively
  # polls readiness, so an instance whose database is unreachable leaves the rotation
  # instead of receiving requests it cannot serve. In a real deployment this role belongs to
  # a Kubernetes Ingress or Container Apps' built-in ingress; nothing here is application
  # code.
  reverse-proxy:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      # Only containers that opt in with traefik.enable, so the database and broker are
      # never accidentally published.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true      # dashboard without auth: local only
      - --log.level=INFO
    ports:
      - "5140:80"     # the address the API used to answer on directly
      - "8081:8080"   # Traefik dashboard
    volumes:
      # Read-only, and local development only. Access to the Docker socket is root on the
      # host; a real deployment uses a provider that does not need it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

  # --- Schema migration, as its own step ---
  #
  # The same image, run with --migrate-only, applying migrations and exiting. The API waits
  # for it to succeed. This exists because three replicas calling MigrateAsync at startup
  # raced to create the database and two died on a command timeout - migrating is an
  # administrative task, and doing it during startup means doing it once per replica.
  migrator:
    build:
      context: .
      dockerfile: src/DocumentService.Api/Dockerfile
    command: ["--migrate-only"]
    env_file:
      - ./docker/env/api.env
    restart: "no"
    depends_on:
      sqledge:
        condition: service_healthy
    networks:
      - backend

  # --- API ---
  api:
    build:
      context: .
      dockerfile: src/DocumentService.Api/Dockerfile
    env_file:
      - ./docker/env/api.env
    # No host port on purpose. Publishing one would cap this service at a single replica,
    # because the second would collide on it. Traefik reaches the container port instead,
    # which is what makes `docker compose up --scale api=3` possible at all.
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.documentapi.rule=PathPrefix(`/`)
      - traefik.http.routers.documentapi.entrypoints=web
      - traefik.http.routers.documentapi.middlewares=documentapi-retry
      # A replica killed mid-request costs that request, because health checks only notice
      # afterwards. Retry resends it to another replica.
      #
      # Safe here only because the endpoints are idempotent: registering a document is
      # keyed on a client-supplied id, and analysis goes through the outbox. Traefik retries
      # when the backend connection fails rather than when it returns an error, so a request
      # the API actually processed is not resent - but on a non-idempotent API this would
      # still be the wrong default.
      - traefik.http.middlewares.documentapi-retry.retry.attempts=3
      - traefik.http.middlewares.documentapi-retry.retry.initialinterval=100ms
      - traefik.http.services.documentapi.loadbalancer.server.port=8080
      # The readiness endpoint doing the job it exists for: Traefik polls it and routes
      # only to replicas that answer.
      - traefik.http.services.documentapi.loadbalancer.healthcheck.path=/health/ready
      - traefik.http.services.documentapi.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.documentapi.loadbalancer.healthcheck.timeout=3s
    healthcheck:
      # Readiness, not liveness: this is what an orchestrator would ask before sending
      # traffic. It fails while the database is unreachable and passes while the broker is,
      # which is the behaviour the outbox is there to provide.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      servicebus:
        condition: service_started
      sqledge:
        condition: service_healthy
      # Replicas no longer migrate. They wait for the one-shot migrator to finish, so every
      # instance starts against a schema that is already correct.
      migrator:
        condition: service_completed_successfully
    networks:
      - backend

  # --- Worker ---
  worker:
    build:
      context: .
      dockerfile: src/AnalysisService.Worker/Dockerfile
    env_file:
      - ./docker/env/worker.env
    depends_on:
      - servicebus
    networks:
      - backend

networks:
  backend:
    driver: bridge

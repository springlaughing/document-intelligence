version: '3.9'

services:
  # --- Azure Service Bus Emulator ---
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SbEmuAdmin!2025"
    ports:
      - "1433:1433"   # optional, but good for debugging
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "SbEmuAdmin!2025"
      ACCEPT_EULA: Y
      SQL_WAIT_INTERVAL: 20
    volumes:
      - ./infrastructure/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"  # AMQP (what Azure.Messaging.ServiceBus uses)
      - "5300:5300"  # Optional management/diagnostics port
    depends_on:
      sqledge:
        condition: service_healthy
    networks:
      - backend

  # --- API ---
  api:
    build:
      context: .
      dockerfile: src/DocumentService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AzureServiceBus__ConnectionString: "Endpoint=sb://servicebus/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=local;UseDevelopmentEmulator=true;"
      AzureServiceBus__AnalyzeDocumentQueueName: "analyze-document"
      AzureServiceBus__AnalysisCompletedTopicName: "analysis-completed"
      AzureServiceBus__AnalysisCompletedSubscriptionName: "document-api"
    ports:
      - "5140:8080"
    depends_on:
      - servicebus
    networks:
      - backend

  # --- Worker ---
  worker:
    build:
      context: .
      dockerfile: src/AnalysisService.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AzureServiceBus__ConnectionString: "Endpoint=sb://servicebus/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=local;UseDevelopmentEmulator=true;"
      AzureServiceBus__AnalyzeDocumentQueueName: "analyze-document"
      AzureServiceBus__AnalysisCompletedTopicName: "analysis-completed"
    depends_on:
      - servicebus
    networks:
      - backend

networks:
  backend:
    driver: bridge

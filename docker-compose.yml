version: '3.9'

services:
  # --- Azure Service Bus Emulator ---
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    env_file:
      - ./docker/env/sqledge.env
    ports:
      - "1433:1433"   # optional, but good for debugging
    healthcheck:
      # Full path: the image ships sqlcmd in /opt/mssql-tools/bin but does not put it on
      # PATH, so a bare "sqlcmd" always exits 127. That made this check unpassable, and
      # with servicebus waiting on service_healthy it meant the stack never came up.
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # SQL Edge needs a while before it accepts connections; without this the retries
      # are spent on a server that simply has not finished starting.
      start_period: 30s
    networks:
      - backend

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    env_file:
      - ./docker/env/servicebus.env
    volumes:
      - ./infrastructure/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"  # AMQP (what Azure.Messaging.ServiceBus uses)
      - "5300:5300"  # Optional management/diagnostics port
    depends_on:
      sqledge:
        condition: service_healthy
    networks:
      - backend

  # --- API ---
  api:
    build:
      context: .
      dockerfile: src/DocumentService.Api/Dockerfile
    env_file:
      - ./docker/env/api.env
    ports:
      - "5140:8080"
    depends_on:
      servicebus:
        condition: service_started
      # The API applies migrations at startup, so the database must be up first.
      sqledge:
        condition: service_healthy
    networks:
      - backend

  # --- Worker ---
  worker:
    build:
      context: .
      dockerfile: src/AnalysisService.Worker/Dockerfile
    env_file:
      - ./docker/env/worker.env
    depends_on:
      - servicebus
    networks:
      - backend

networks:
  backend:
    driver: bridge
